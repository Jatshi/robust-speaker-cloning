name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2 torchaudio==2.1.2
      - run: pip install -r requirements.txt ruff
      - run: ruff check src tests app.py --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py
